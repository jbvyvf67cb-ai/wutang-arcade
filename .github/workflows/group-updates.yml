name: Group updates

# Four times a day (8 AM, 2 PM, 8 PM, midnight US Central — CDT/UTC-5;
# GitHub cron is UTC and ignores DST, so runs land an hour later in
# winter local time). Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "0 13 * * *" # 8:00 AM CDT
    - cron: "0 19 * * *" # 2:00 PM CDT
    - cron: "0 1 * * *"  # 8:00 PM CDT
    - cron: "0 5 * * *"  # midnight CDT
  workflow_dispatch:

# Never let two update runs overlap (and don't cancel a run mid-edit)
concurrency:
  group: group-updates
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # to dispatch the Pages deploy after pushing

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the queue
        id: queue
        run: |
          count=$(find updates/queue -type f ! -name '.gitkeep' ! -name 'README*' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Queue has $count request file(s)."
          find updates/queue -type f ! -name '.gitkeep' || true

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.count != '0'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.queue.outputs.count != '0'
        run: npm ci

      - name: Apply the queued updates with Claude
        if: steps.queue.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-opus-4-8 --max-turns 250 --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,NotebookEdit"'
          prompt: |
            You are the group-updates routine for JOSHUA — A French Quarter
            Bear Tale, a 3D Babylon.js platformer in this repo. Players have
            queued change requests as text files in updates/queue/. Your job
            this run:

            1. Read PLAN.md first (the design contract — §9 is the quality
               rubric, "Technical landmines" lists things you must not
               re-break). Then read every file in updates/queue/ (ignore
               .gitkeep).
            2. Implement the requests. Use judgment: reconcile conflicting
               requests, scale back anything that would break the game,
               budgets (≤120 draw calls in view, ≤25 MB payload), or the
               PLAN.md rubric, and decline (with a written reason) anything
               unsafe or out of scope. Real gameplay/visual changes are the
               goal — be ambitious but keep the game shippable.
            3. Verify: `npm run build` must pass (type-check + production
               build + bundle trim). If you changed the map pipeline, re-run
               `python3 tools/map/build_map.py` and commit the regenerated
               assets/map/quarter.json. Do NOT run the Playwright suite here
               (no WebGL on runners); rely on the build gate and code review.
            4. Archive: create updates/processed/<UTC timestamp, e.g.
               2026-06-12T13-00>/ and move every processed request file into
               it. Write a SUMMARY.md there describing, per request, what you
               did or why you didn't. Leave updates/queue/ empty except
               .gitkeep.
            5. Do NOT commit or push — the workflow handles git after you
               finish. Do not create pull requests.

      - name: Commit and push
        if: steps.queue.outputs.count != '0'
        id: push
        run: |
          git config user.name "claude-group-updates[bot]"
          git config user.email "noreply@anthropic.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stamp=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "group updates: $stamp ($(printf '%s' "${{ steps.queue.outputs.count }}") request(s))"
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            if git push origin HEAD; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "Push failed after retries." >&2
          exit 1

      - name: Trigger the Pages deploy
        # pushes made with GITHUB_TOKEN don't fire other workflows,
        # so dispatch the deploy explicitly
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
